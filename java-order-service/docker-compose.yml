services:

  order-mysql:
    container_name: order-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ticket4u
    ports:
      - "3301:3306"
    networks:
      - microservice-net

  order-redis:
    container_name: order-redis
    image: redis:8.0
    ports:
      - "6304:6379"
    networks:
      - microservice-net

  java-order-service:
    build: .
    container_name: java-order-service
    ports:
      - "8086:8086"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - order-mysql
      - order-redis
    networks:
      - microservice-net

networks:
  microservice-net:
    external: true
